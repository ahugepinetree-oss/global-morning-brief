<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Morning Brief</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f7f3;color:#171717;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e7e7df;border-radius:18px;padding:22px;margin-bottom:16px}
button{cursor:pointer;border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.hidden{display:none}.archive-item{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0;cursor:pointer}.archive-item:hover{background:#f2f2ec}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header><b>GLOBAL MORNING BRIEF</b><div><button id="todayBtn">Today</button> <button id="archiveBtn">Past Briefs</button></div></header>
<div id="archivePanel" class="card hidden"><h2>Past Briefs</h2><div id="archiveList"></div></div>
<div id="brief">
<section class="card"><div id="date" class="muted"></div><h1 id="headline">Loading…</h1><p id="dek" class="muted"></p></section>
<section class="card"><h2>Words worth knowing</h2><div id="vocab"></div></section>
<section class="card"><h2 id="storytitle"></h2><div id="story"></div><button id="b2btn">Show B2 help</button><div id="b2" class="hidden"></div></section>
<section class="card"><h2>Global snapshot</h2><div id="countries" class="grid"></div><p><b id="common"></b></p></section>
<section class="card"><h2>News expressions</h2><div id="expressions"></div></section>
<section class="card"><h2 id="conceptTitle"></h2><p id="conceptBody"></p></section>
<section class="card"><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p></section>
<section class="card"><h2 id="sentence"></h2><button id="listen">🔊 Listen</button></section>
<section class="card"><h2>Sources</h2><div id="sources"></div></section>
</div></div>
<script>
let D=null; const $=x=>document.getElementById(x);
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}}
function render(){
 $("date").textContent=D.date_display||D.date_iso||""; $("headline").textContent=D.headline||""; $("dek").textContent=D.dek||"";
 $("storytitle").textContent=D.story_title||""; $("story").innerHTML=D.story_html||""; $("b2").innerHTML="<h3>B2 help</h3><p>"+(D.b2_summary||"")+"</p>";
 $("vocab").innerHTML=(D.vocabulary||[]).map(x=>`<div class="row"><div><b>${x.term}</b><br><span class="muted">${x.meaning}</span></div><button onclick='speak(${JSON.stringify(x.term)})'>🔊</button></div>`).join("");
 $("countries").innerHTML=(D.countries||[]).map(x=>`<div class="card"><b>${x.flag} ${x.name}</b><br>${x.focus}</div>`).join("");
 $("common").textContent="What the world is watching: "+(D.common_theme||"");
 $("expressions").innerHTML=(D.expressions||[]).map(x=>`<div class="row"><div><b>${x.term}</b><br><span class="muted">${x.meaning}</span><br>${x.example||""}</div><button onclick='speak(${JSON.stringify(x.term)})'>🔊</button></div>`).join("");
 $("conceptTitle").textContent=D.concept?.title||""; $("conceptBody").textContent=D.concept?.explanation||"";
 $("question").textContent=D.quiz?.question||""; $("answers").innerHTML=(D.quiz?.options||[]).map((x,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button> `).join("");
 $("sentence").textContent=D.one_sentence||""; $("listen").onclick=()=>speak(D.one_sentence||"");
 $("sources").innerHTML=(D.sources||[]).map(s=>`<p><b>${s.name}</b> · ${s.region||""}<br><a target="_blank" href="${s.url}">${s.title||s.url}</a></p>`).join("");
}
function answer(i){$("feedback").textContent=i===D.quiz.answer_index?"✓ "+D.quiz.explanation:"Try again."}
async function load(url){D=await fetch(url+"?v="+Date.now()).then(r=>r.json());$("archivePanel").classList.add("hidden");$("brief").classList.remove("hidden");render();scrollTo(0,0)}
async function archives(){let a=await fetch("data/archive_index.json?v="+Date.now()).then(r=>r.json());$("brief").classList.add("hidden");$("archivePanel").classList.remove("hidden");$("archiveList").innerHTML=a.map(x=>`<div class="archive-item" onclick="load('${x.file}')"><span class="muted">${x.date_display||x.date_iso}</span><br><b>${x.headline}</b></div>`).join("")||"<p>No archived briefs yet.</p>"}
$("todayBtn").onclick=()=>load("data/today.json"); $("archiveBtn").onclick=archives; $("b2btn").onclick=()=>{$("b2").classList.toggle("hidden")};
load("data/today.json");
</script></body></html>
